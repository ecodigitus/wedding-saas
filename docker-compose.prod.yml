# Compose untuk server staging. Image di-build lokal (bukan di server yang
# resource-nya kecil) lalu di-load via `docker load` — compose ini cuma
# menjalankan image yang sudah ada, tidak build dari source di server.
#
# Postgres & Redis TIDAK di-expose ke luar (tanpa `ports:`) — cuma bisa
# diakses dari dalam network compose ini, tidak dari internet.
#
# mem_limit dipasang ketat karena server ini dipakai bareng Odoo produksi
# klien yang sudah aktif — kalau project ini kena limit duluan, itu lebih
# baik daripada bikin Odoo kehabisan memori.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wedding_saas
    volumes:
      - wedding-postgres-data:/var/lib/postgresql/data
    mem_limit: 300m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - wedding-redis-data:/data
    mem_limit: 80m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: wedding-saas-backend:latest
    restart: unless-stopped
    env_file: backend.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    mem_limit: 250m

  frontend:
    image: wedding-saas-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    mem_limit: 250m

volumes:
  wedding-postgres-data:
  wedding-redis-data:
